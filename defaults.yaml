      - [suwari_waza,    yokomen_uchi,        nikyo]
      - [hanmi_handachi, katate_dori,         ikkyo]
      - [hanmi_handachi, katate_dori,         kaiten_nage]
      - [hanmi_handachi, katate_dori,         nikyo]
      - [hanmi_handachi, katate_dori,         sankyo]
      - [hanmi_handachi, katate_dori,         shiho_nage]
      - [hanmi_handachi, ryote_dori,          shiho_nage]
      - [hanmi_handachi, ushiro_ryote_dori,   ikkyo]
      - [hanmi_handachi, ushiro_ryote_dori,   irimi_nage]
      - [hanmi_handachi, ushiro_ryote_dori,   kote_gaeshi]
      - [tachi_waza,     kata_dori,           ikkyo]
