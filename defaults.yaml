# Aikido default vocabulary and preset profiles.
# Source: Aikikai Foundation Hombu Dojo Grading Examination System
#         https://aikikai.or.jp/eng/hombudojo/grading/
#

vocab:
  positions:
    - key: tachi_waza
      name: "Tachi Waza"
    - key: suwari_waza
      name: "Suwari Waza"
    - key: hanmi_handachi
      name: "Hanmi Handachi"

  attacks:
    - key: shomen_uchi
      name: "Shomen Uchi"
    - key: yokomen_uchi
      name: "Yokomen Uchi"
    - key: tsuki
      name: "Tsuki"
    - key: katate_dori
      name: "Katate Dori"
    - key: kata_dori
      name: "Kata Dori"
    - key: kata_dori_menuchi
      name: "Kata Dori Men Uchi"
    - key: ryote_dori
      name: "Ryote Dori"
    - key: morote_dori
      name: "Morote Dori"
    - key: ushiro_ryote_dori
      name: "Ushiro Ryote Dori"
    - key: ushiro_ryokata_dori
      name: "Ushiro Ryokata Dori"
    - key: ushiro_kubishime
      name: "Ushiro Kubishime"

  techniques:
    - key: ikkyo
      name: "Ikkyo"
    - key: nikyo
      name: "Nikyo"
    - key: sankyo
      name: "Sankyo"
    - key: yonkyo
      name: "Yonkyo"
    - key: gokyo
      name: "Gokyo"
    - key: irimi_nage
      name: "Irimi Nage"
    - key: tenchi_nage
      name: "Tenchi Nage"
    - key: kote_gaeshi
      name: "Kote Gaeshi"
    - key: shiho_nage
      name: "Shiho Nage"
    - key: kaiten_nage
      name: "Kaiten Nage"
    - key: juji_nage
      name: "Juji Nage"
    - key: koshi_nage
      name: "Koshi Nage"
    - key: kokyu_ho
      name: "Kokyu Ho"
    - key: kokyu_nage
      name: "Kokyu Nage"


# ── Presets ────────────────────────────────────────────────────────────────────
# Each combo: [position_key, attack_key, technique_key]
# Sorted: suwari_waza → hanmi_handachi → tachi_waza;
#         within each block: attack key asc, then technique key asc.

presets:
  # ── Shodan ──────────────────────────────────────────────────────────────────
  # Full unarmed curriculum: all positions, all standard attack/technique pairs
